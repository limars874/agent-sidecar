# Maintain a compact current-state snapshot, not a chronological activity log.
everyTurns: 3
context:
  scope: delta
  include: [user, assistant, toolCall]
  files:
    - "out/{agent}/{sessionMonth}/{session}/summary.md"
  maxChars: 30000
output:
  file: out/{agent}/{sessionMonth}/{session}/summary.md
  mode: replace
prompt: |
  Maintain the current state of this coding session.
  Use the existing snapshot and the new transcript below to produce a complete replacement snapshot.
  Include only current work, decisions, changed files, verified results, and open issues.
  Do not write a chronological log or repeat background that is already clear.
  Use at most 5 concise bullets or sections. Reply with the complete snapshot only.

  {{transcript}}
